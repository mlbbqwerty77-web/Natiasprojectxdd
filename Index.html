<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
        }

        /* --- შესვლის (Login) ფანჯარა --- */
        #login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }

        .login-card {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            border: 1px solid #334155;
        }

        .login-card h2 {
            text-align: center;
            margin-bottom: 8px;
            color: #38bdf8;
            font-size: 24px;
            font-weight: 700;
        }

        .login-card p {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: #0369a1;
        }

        .error-msg {
            color: #f43f5e;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            display: none;
        }

        /* --- მთავარი დაფა (Dashboard) --- */
        #dashboard-screen {
            display: none;
            padding: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: #1e293b;
            padding: 20px 30px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .logo-area h1 {
            font-size: 22px;
            color: #38bdf8;
            font-weight: 700;
        }

        .logo-area span {
            font-size: 12px;
            color: #94a3b8;
            display: block;
        }

        .logout-btn {
            background: #334155;
            color: #f8fafc;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .logout-btn:hover {
            background: #475569;
        }

        /* სექცია და ძებნა */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 280px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 45px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            font-size: 15px;
        }

        .search-box input:focus {
            outline: none;
            border-color: #38bdf8;
        }

        .search-box svg {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: #94a3b8;
        }

        .stats-badge {
            background: #1e293b;
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #334155;
            font-size: 14px;
            color: #cbd5e1;
        }

        .stats-badge span {
            color: #38bdf8;
            font-weight: 600;
        }

        /* ცხრილის სტილები */
        .table-container {
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            max-height: 650px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: #0f172a;
            padding: 16px 20px;
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            border-bottom: 1px solid #334155;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 14px 20px;
            border-bottom: 1px solid #334155;
            font-size: 14px;
            color: #e2e8f0;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(56, 189, 248, 0.03);
        }

        .id-cell {
            color: #64748b;
            font-weight: 500;
        }

        @media(max-width: 768px) {
            #dashboard-screen {
                padding: 15px;
            }
            header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }
    </style>
</head>

            const randomSurname = lastNames[Math.floor(Math.random() * lastNames.length)];
            const randomCityObj = citiesList[Math.floor(Math.random() * citiesList.length)];
            const randomStreet = randomCityObj.streets[Math.floor(Math.random() * randomCityObj.streets.length)];
            const randomHouseNum = Math.floor(Math.random() * 120) + 1;

            databaseRecords.push({
                id: i,
                name: randomName,
                surname: randomSurname,
                city: randomCityObj.city,
                address: `${randomStreet} #${randomHouseNum}`
            });
        }

        // ცხრილის ჩატვირთვა
        function loadData(data = databaseRecords) {
            const tbody = document.getElementById('dataTable');
            tbody.innerHTML = "";
            
            data.forEach(item => {
                const row = `<tr>
                    <td class="id-cell">#${item.id}</td>
                    <td><b>${item.name}</b></td>
                    <td>${item.surname}</td>
                    <td><span style="color: #38bdf8;">${item.city}</span></td>
                    <td>${item.address}</td>
                </tr>`;
                tbody.innerHTML += row;
            });

            document.getElementById('total-count').innerText = data.length;
        }

        // საძიებო ფუნქცია
        function filterTable() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const filtered = databaseRecords.filter(item => 
                item.name.toLowerCase().includes(input) || 
                item.surname.toLowerCase().includes(input) || 
                item.city.toLowerCase().includes(input) || 
                item.address.toLowerCase().includes(input)
            );
            loadData(filtered);
        }
